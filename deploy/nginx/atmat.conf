# Nginx reverse proxy for AtMat (Docker mode).
# Install: sudo cp deploy/nginx/atmat.conf /etc/nginx/sites-available/atmat
# Replace the example domains first, for example:
#   sudo sed -i 's/example\.com/your-domain.ir/g' /etc/nginx/sites-available/atmat
# Then: sudo ln -s /etc/nginx/sites-available/atmat /etc/nginx/sites-enabled/atmat
# sudo nginx -t && sudo systemctl reload nginx
# Then issue TLS with certbot (see DEPLOY-DOCKER.md).

server {
    listen 80;
    server_name example.com;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        include /etc/nginx/snippets/atmat-proxy.conf;
    }
}

server {
    listen 80;
    server_name admin.example.com;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/snippets/atmat-proxy.conf;
    }
}

server {
    listen 80;
    server_name media.example.com;

    # Read-only public access to uploaded images. Console and other MinIO paths stay private.
    location ^~ /at-mat-assets/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/snippets/atmat-proxy.conf;
    }

    location / {
        return 404;
    }
}
